name: Validate countdown
on:
  push:
    branches: ["codex/**", "feature/**", "cleanup/**"]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Run logic tests
        run: node --test test/countdown-core.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test and capture screenshots
        run: mkdir -p artifacts && node test/browser-smoke.cjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countdown-visual-review
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
