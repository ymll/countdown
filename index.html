<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Personalised countdown timer — pick a date and watch the days tick down, with a little plane flying towards it.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Amatic+SC|Fredericka+the+Great">
<link rel="stylesheet" href="css/index.css">

<title>Countdown Timer</title>
</head>
<body>
<div class="container">
  <div id="setting" role="button" tabindex="0" title="Settings" aria-label="Settings">
    <i class="fa fa-cog fa-2x" aria-hidden="true"></i>
  </div>
  <div class="wrapper">
    <div id="text">
      <p>
        <span id="title"></span>
        <br>
        <span id="countdown">
        </span>
      </p>
      <div id="progress">
        <div id="progress-track">
          <div id="progress-fill"></div>
          <span id="progress-start" aria-hidden="true">&#8226;</span>
          <span id="progress-plane" aria-hidden="true">&#9992;</span>
          <span id="progress-end" aria-hidden="true">&#10084;</span>
        </div>
        <div id="progress-label"></div>
      </div>
      <p>
        <span id="clock"></span>
        <br>
        <span id="date"></span>
      </p>
    </div>
    <div id="settingModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <p>Set Countdown Date:</p>
        <form id="settingForm">
          <label>
            <input id="countdowndate" type="date" name="countdowndate" required>
          </label>
          <button id="submit" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
  <div id="footer"></div>
</div>

<script src="js/index.js"></script>
<script src="https://use.fontawesome.com/4855f43d1e.js"></script>
</body>
</html>
